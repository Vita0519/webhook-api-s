<!DOCTYPE html>
<html lang="zh-CN" data-theme="cyber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f4">
  <title>Webhook 工作台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="assets/theme.css?v=20261110-v1">
</head>
<body>
  <div id="boot" class="boot">
    <div class="spin"></div>
    <p>正在连接中继服务…</p>
  </div>

  <div id="app" hidden>
    <aside id="sidebar">
      <div class="brand">
        <b id="brandName">Webhook</b>
        <span>Relay Workbench</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-user" id="sideUser"></div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="iconbtn menubtn" id="menuBtn" aria-label="菜单"></button>
        <h1 id="pageTitle">总览</h1>
        <span class="sub" id="pageSub"></span>
        <span class="spacer"></span>
        <div class="theme-switch" id="themeSwitch" title="切换主题">
          <button type="button" data-theme-opt="cyber" class="on">赛博</button>
          <button type="button" data-theme-opt="amber">黑金</button>
          <button type="button" data-theme-opt="ops">工程</button>
        </div>
        <span class="live" id="liveState"></span>
      </header>
      <main id="view"></main>
    </div>
  </div>

  <div id="toast" class="toast-wrap"></div>
  <div id="modal" class="modal-wrap" hidden></div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
