}

.th-host{position:relative;height:100%}
.picker{position:fixed;z-index:100;inset:0;display:grid;place-items:center;background:var(--scrim);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}

.pk-list{display:grid;gap:8px}
.tcard{display:grid;grid-template-columns:84px minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;box-sizing:border-box;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--sheet-line);border-radius:6px;padding:8px 12px 8px 8px;cursor:pointer}

.sw-ion{background:linear-gradient(90deg,transparent 19px,rgba(255,240,230,.95) 19.6px 20.8px,transparent 21.4px 41px,rgba(255,240,230,.95) 41.6px 42.8px,transparent 43.4px 63px,rgba(255,240,230,.95) 63.6px 64.8px,transparent 65.4px),linear-gradient(90deg,transparent 14px,rgba(255,61,31,.55) 16px 24px,transparent 26px 36px,rgba(255,61,31,.55) 38px 46px,transparent 48px 58px,rgba(255,61,31,.55) 60px 68px,transparent 70px),linear-gradient(180deg,transparent 21px,#ffd23f 21px 23px,transparent 23px) 4px 0/62px 48px no-repeat,repeating-linear-gradient(180deg,transparent 0 4px,rgba(255,120,80,.22) 4px 10px,transparent 10px 12px),#0a0608}

<!-- ===== 主题 01 · OPS 纸面工程（原 Agent Ops 调度大屏） ===== -->
<template id="tpl-park">
<style>
/* Layout: 微缩工业园区作战大屏 —— 两层场景：
   园区层：中间是调度中枢（总调度 Agent），6 座厂房围着它分布，每座厂房 = 1 条 Agent 工作流；高架传送带把工单箱从中枢送进各车间，成品从车间另一头出来再送回中枢交付。
   车间层：点一座厂房，镜头飞进去，屋顶掀开、侧墙降下，看到车间内的流水线，每台机器 = 工作流里的一道工序，头顶各有运作状态栏。
   左栏 / 右栏 / 底栏的框体随场景切换内容：园区层看总工程数据、各车间进度、工序矩阵；车间层看工序流程、在制工单、车间读数、Agent 终端、节拍甘特。
   左上标题、右上按钮与前几款同一套写法；顶部中间是场景导航与昼夜时钟。3D 是原生 WebGL（阴影、昼夜、移轴、泛光），不依赖 three.js。 */
:host{
  color-scheme:dark;
  --bg:#070a08; --panel:rgba(8,12,10,.8); --card:rgba(13,18,15,.86);
  --line:rgba(170,255,190,.1); --line-2:rgba(170,255,190,.26);
  --fg:#eaf2ec; --fg-2:#a3b3a8; --fg-3:#67776d;
  --hi:#9be15d; --or:#ff8a3d; --ok:#3fe39b; --warn:#ffb22e; --bad:#ff4f45;
  --display:"Syncopate","Noto Sans SC",system-ui,sans-serif;
  --mono:"JetBrains Mono","Noto Sans SC","PingFang SC",ui-monospace,Menlo,monospace;
  --cjk:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
:host{display:block;height:100%;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--mono);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
*{box-sizing:border-box}
.app{position:absolute;inset:0;overflow:hidden}
.gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.gl.drag{cursor:grabbing}
.gl.pick{cursor:pointer}
.fx{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 80% at 50% 50%,transparent 60%,rgba(0,0,0,.42) 100%)}
.nr{position:absolute;inset:0;pointer-events:none}
.fit{position:absolute;inset:0;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);pointer-events:none}
.narrow .fit{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fit-in{position:relative;width:100%;height:100%}
.board{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,.5));pointer-events:none}
.pe{pointer-events:auto}

/* ---------- 左上标题（与前几款同款） ---------- */
.topfade{position:absolute;left:-40px;top:0;width:900px;height:280px;background:radial-gradient(ellipse 720px 270px at 0 0,rgba(5,8,6,.94),rgba(5,8,6,.66) 55%,rgba(5,8,6,0) 88%)}
.botfade{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(0deg,rgba(5,8,6,.88),rgba(5,8,6,.5) 55%,transparent)}
.hd{position:absolute;left:10px;top:18px;width:max-content;text-shadow:0 0 6px var(--bg),0 0 14px var(--bg)}
.eb{width:max-content;font-size:10px;letter-spacing:.26em;color:var(--fg-3);white-space:nowrap}
.eb b{color:var(--hi);font-weight:500}
.hd h1{margin:12px 0 0;font-family:var(--display);font-weight:700;font-size:44px;line-height:1.06;letter-spacing:.05em;color:var(--fg)}
.hd h1 span{display:block;width:max-content;white-space:nowrap}
.hd h1 .l1{display:flex;align-items:center;width:max-content}
.hd h1 em{font-style:normal;font-family:var(--cjk);font-weight:900;font-size:36px;line-height:1;letter-spacing:.08em;margin-left:22px;text-shadow:none;background:linear-gradient(90deg,#d8f56a,#3fe3a8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(63,227,168,.3))}
.sub{width:max-content;margin-top:12px;font-family:var(--cjk);font-size:14px;letter-spacing:.06em;color:var(--fg-2);white-space:nowrap}
.sub2{width:max-content;margin-top:6px;font-size:10px;letter-spacing:.16em;color:var(--fg-3);white-space:nowrap}
.sub2 b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}

/* ---------- 右上按钮（与前几款同款） ---------- */
.tools{position:absolute;right:10px;top:14px;display:flex;gap:6px}
button.tb{font:500 11px/1 var(--mono);letter-spacing:.1em;color:var(--fg-2);background:rgba(8,12,10,.8);border:1px solid rgba(190,255,200,.28);padding:8px 11px;cursor:pointer;white-space:nowrap}
button.tb b{color:var(--fg);font-weight:700;font-family:var(--cjk);margin-left:6px;letter-spacing:.04em}
button.tb:hover{border-color:var(--hi);color:var(--fg)}
button.tb:focus-visible{outline:1px solid var(--hi);outline-offset:2px}
.strip{position:absolute;right:10px;top:52px;display:flex;gap:16px;padding:5px 10px;background:rgba(8,12,10,.74);border:1px solid var(--line);font-size:9.5px;letter-spacing:.12em;color:var(--fg-3);white-space:nowrap;text-shadow:0 0 6px var(--bg)}
.strip b{color:var(--fg);font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums}
.strip .live::before,.live-dot::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:1px;box-shadow:0 0 6px var(--ok)}

/* ---------- 顶部中间：场景导航 + 昼夜时钟 ---------- */
.crumb{position:absolute;left:50%;top:16px;transform:translateX(-50%);display:flex;align-items:stretch;gap:6px;white-space:nowrap}
.cr{display:flex;align-items:center;gap:9px;height:38px;padding:0 14px;background:rgba(8,12,10,.82);border:1px solid var(--line-2);backdrop-filter:blur(6px);font-size:11px;letter-spacing:.08em;color:var(--fg-2)}
.cr b{font-family:var(--cjk);font-size:15px;font-weight:700;color:var(--fg);letter-spacing:.04em}
.cr .big{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--hi);letter-spacing:0}
.cr em{font-style:normal;font-size:10px;letter-spacing:.18em;color:var(--fg-3)}
.cr .cr-n{font-size:12px;font-weight:700;color:var(--c,var(--hi))}
.cr-hall{border-color:var(--c,var(--line-2));box-shadow:inset 0 -2px 0 var(--c,transparent)}
.cb{font:600 11px/1 var(--cjk);letter-spacing:.06em;color:var(--fg-2);background:transparent;border:1px solid rgba(190,255,200,.2);padding:6px 9px;cursor:pointer}
.cb:hover{color:var(--fg);border-color:var(--hi)}
.cb:focus-visible,.tod:focus-visible{outline:1px solid var(--hi);outline-offset:2px}
.tod{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:rgba(8,12,10,.82);border:1px solid var(--line-2);backdrop-filter:blur(6px);color:var(--fg-2);font:500 10px/1 var(--mono);letter-spacing:.1em;cursor:pointer}
.tod i{font-style:normal;font-size:15px;color:#ffd257;width:16px;text-align:center}
.tod b{font-size:16px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tod span{font-family:var(--cjk);font-size:11px;color:var(--fg-2);letter-spacing:.04em}
.tod:hover{border-color:var(--hi)}
.park .cr-hall,.park .cr-hub,.hall .cr-park,.hall .cr-hub,.hub .cr-park,.hub .cr-hall{display:none}
.cr-hub{border-color:var(--or);box-shadow:inset 0 -2px 0 var(--or)}
.cr-hub .cr-n{color:var(--or)}
.cb.hubb{color:#ffd9bd;border-color:rgba(255,138,61,.55);font-weight:700}
.cb.hubb:hover{border-color:var(--or);color:#fff}
.cb.stop{color:#ffb4ae;border-color:rgba(255,79,69,.55)}
.cb.go{color:#b9f5d4;border-color:rgba(63,227,155,.55)}

/* ---------- 框体 ---------- */
.panel{position:relative;background:var(--panel);border:1px solid var(--line);min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(6px)}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;pointer-events:none;border:1px solid var(--line-2);z-index:1}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-color:var(--hi)}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.ph{flex:none;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:9px 12px 7px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap;background:linear-gradient(90deg,rgba(155,225,93,.07),transparent 60%)}
.ph>span:first-child{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis}
.ph b{color:var(--hi);font-weight:700;margin-right:2px}
.ph .hz{display:inline-block;width:26px;height:6px;margin-right:8px;vertical-align:0;background:repeating-linear-gradient(-45deg,var(--hi) 0 3px,#0d140b 3px 6px);opacity:.75}
.ph .hc{color:var(--c,var(--hi))}
.bar{display:block;height:4px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c,var(--hi));transition:width .15s linear}
.pill{display:inline-block;font:700 9px/1 var(--cjk);letter-spacing:.06em;padding:3px 6px 3px;border:1px solid currentColor;white-space:nowrap;font-style:normal}
.s-run{color:var(--c,var(--ok))}
.s-done{color:var(--ok)}
.s-idle{color:var(--fg-3)}
.s-hold,.s-block,.s-wait{color:var(--warn)}
.s-rej{color:var(--bad)}
.pg{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;animation:pgin .5s ease-out}
.park .pg-hall,.hub .pg-hall,.hall .pg-park{display:none}
@keyframes pgin{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 左栏 */
.col-l{position:absolute;left:10px;top:214px;bottom:40px;width:360px;display:flex;flex-direction:column;gap:12px}
.col-r{position:absolute;right:10px;top:84px;bottom:40px;width:360px;display:flex;flex-direction:column;gap:12px}
/* 园区 01 总览 */
.ovp{flex:none;height:306px}
.kg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:9px 10px 6px}
.kg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kt{position:relative;background:var(--card);border:1px solid rgba(190,255,200,.07);padding:7px 10px 7px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kt::before{content:"";position:absolute;left:-1px;top:-1px;width:16px;height:2px;background:var(--hi)}
.kt span{font-size:8.5px;letter-spacing:.14em;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt span em{font-style:normal;font-family:var(--cjk);color:var(--fg-2);letter-spacing:.06em;margin-right:5px;font-size:10px}
.kt b{font-size:25px;font-weight:700;line-height:1.05;letter-spacing:-.01em;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.kt b small{font-size:11px;color:var(--fg-3);margin-left:3px;font-weight:500}
.kg3 .kt{padding:6px 8px 6px}
.kg3 .kt b{font-size:19px}
.kg3 .kt span em{display:block;margin:0 0 1px}
.kt .d{font-size:9px;color:var(--fg-3);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.kt .d.up{color:var(--ok)}
.kt .d.dn{color:var(--warn)}
.kt.hl b{color:var(--hi);text-shadow:0 0 14px rgba(155,225,93,.35)}
.share{flex:none;padding:4px 12px 10px}
.share .sh-t{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.12em;color:var(--fg-3);margin-bottom:5px;white-space:nowrap}
.share .sh-b{display:flex;height:8px;gap:2px}
.share .sh-b i{display:block;height:100%;background:var(--c);transition:flex-grow .6s}
.share .sh-l{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px 10px;margin-top:7px;font-size:9px;color:var(--fg-3);white-space:nowrap}
.share .sh-l span{display:flex;gap:5px;align-items:center;overflow:hidden}
.share .sh-l span::before{content:"";width:7px;height:7px;background:var(--c);flex:none}
.share .sh-l b{font-family:var(--cjk);font-weight:500;color:var(--fg-2)}
.share .sh-l u{text-decoration:none;color:var(--fg);margin-left:auto;font-variant-numeric:tabular-nums}
/* 园区 02 车间进度 */
.wsp{flex:1}
.wsl{flex:1;display:grid;grid-template-rows:repeat(6,minmax(0,1fr));gap:5px;padding:8px 10px 10px;min-height:0}
.wsr{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:9px;row-gap:6px;align-content:center;padding:5px 9px 6px 8px;background:var(--card);border:1px solid rgba(190,255,200,.07);min-height:0;cursor:pointer;pointer-events:auto;transition:border-color .3s,box-shadow .3s}
.wsr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c)}
.wsr .n{grid-row:1/3;align-self:center;font-size:15px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.wsr .nm{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.wsr .nm b{font-family:var(--cjk);font-size:13px;font-weight:700;color:var(--fg)}
.wsr .nm em{font-style:normal;font-size:9px;letter-spacing:.1em;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis}
.wsr .pill{justify-self:end;align-self:center}
.wsr .chain{grid-column:2;display:flex;gap:3px;align-items:center}
.wsr .chain i{flex:1;height:7px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.wsr .chain i u{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--c);text-decoration:none}
.wsr .chain i.h u{background:var(--warn)}
.wsr .chain i.r u{background:var(--bad)}
.wsr .chain i.d u{opacity:.45}
.wsr .o{grid-column:3;grid-row:2;justify-self:end;font-size:9px;color:var(--fg-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.wsr .o b{font-size:11px;color:var(--fg);font-weight:600;margin-right:3px}
.wsr:hover{border-color:var(--c);box-shadow:inset 0 0 22px -12px var(--c)}
.wsr:focus-visible{outline:1px solid var(--fg);outline-offset:-1px}
.wsr.hold .pill{color:var(--warn)}
/* 车间 01 工序流程 */
.flowp{flex:none;height:340px}
.flow{flex:1;display:grid;gap:5px;padding:8px 10px 10px;min-height:0}
.fr{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) 54px;grid-template-rows:auto auto;column-gap:9px;row-gap:5px;align-content:center;padding:4px 9px 5px 8px;background:var(--card);border:1px solid rgba(190,255,200,.07);min-height:0;cursor:pointer;pointer-events:auto;transition:border-color .4s,box-shadow .4s}
.fr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c);opacity:.5}
.fr .n{grid-row:1/3;align-self:center;font-size:15px;font-weight:700;color:var(--fg-3);font-variant-numeric:tabular-nums}
.fr .nm{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.fr .nm b{font-family:var(--cjk);font-size:13px;font-weight:700;color:var(--fg-2)}
.fr .nm em{font-style:normal;font-size:9px;letter-spacing:.1em;color:var(--fg-3);overflow:hidden;text-overflow:ellipsis}
.fr .nm em u{text-decoration:none;color:var(--c)}
.fr .sp{grid-column:3;grid-row:1;justify-self:end}
.fr .ut{grid-column:2;display:grid;grid-template-columns:minmax(0,1fr) 32px;gap:6px;align-items:center;font-size:9px;color:var(--fg-2);font-variant-numeric:tabular-nums;text-align:right}
.fr .cy{grid-column:3;grid-row:2;justify-self:end;font-size:9.5px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.fr .bn{display:none;position:absolute;right:62px;top:6px;font:700 8.5px/1 var(--cjk);color:#170f04;background:var(--warn);padding:2px 4px;letter-spacing:.04em}
.fr.bneck .bn{display:block}
.fr.on{border-color:var(--c);box-shadow:inset 0 0 22px -12px var(--c)}
.fr.on::before{opacity:1}
.fr.on .nm b{color:var(--fg)}
.fr.on .n{color:var(--c)}
.fr:hover{border-color:rgba(190,255,200,.3)}
.fr.sel{outline:1px solid var(--fg);outline-offset:-1px}
.fr:focus-visible{outline:1px solid var(--fg);outline-offset:-1px}
/* 车间 02 在制工单 */
.wipp{flex:1}
.wip{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;padding:7px 10px 4px;min-height:0;overflow:hidden}
.wr{display:grid;grid-template-columns:62px minmax(0,1fr) 70px 52px;gap:8px;align-items:center;padding:4px 6px;border-bottom:1px dashed rgba(190,255,200,.08);font-size:9.5px;color:var(--fg-3);white-space:nowrap}
.wr .id{color:var(--fg-2);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.wr .t{font-family:var(--cjk);font-size:11px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis}
.wr .dots{display:flex;gap:3px}
.wr .dots i{flex:1;height:7px;background:rgba(255,255,255,.07)}
.wr .dots i.f{background:var(--dc)}
.wr .dots i.c{background:var(--dc);animation:pkpulse .7s ease-in-out infinite alternate}
.wr .st{text-align:right;font-family:var(--cjk);font-size:10px;overflow:hidden;text-overflow:ellipsis}
.wr.rw .t::after{content:" 返工";color:var(--bad)}
.wr.new .t{color:var(--fg)}
.wipf{flex:none;display:flex;justify-content:space-between;gap:10px;padding:7px 12px 9px;border-top:1px solid var(--line);font-size:9.5px;color:var(--fg-3);white-space:nowrap;font-family:var(--cjk)}
.wipf b{color:var(--fg);font-weight:500;font-family:var(--mono)}
@keyframes pkpulse{from{opacity:.35}to{opacity:1}}

/* 右栏 03 */
.kpip{flex:none;height:316px}
.thr{flex:1;position:relative;margin:2px 10px 0;min-height:0}
.thr canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.kx{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:6px 12px 9px;border-top:1px dashed var(--line);font-size:9px;color:var(--fg-3);white-space:nowrap}
.kx div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kx b{font-family:var(--cjk);font-size:12px;font-weight:700;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
.kx b.w{color:var(--warn)}
/* 04 调度代码 */
.codep{flex:1}
.code{flex:1;margin:0;padding:6px 10px 6px 0;list-style:none;font:400 9.5px/13.5px var(--mono);color:#7f8a82;overflow:hidden;min-height:0}
.code.sc{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30px);mask-image:linear-gradient(180deg,transparent 0,#000 30px)}
.code li{white-space:pre;overflow:hidden;text-overflow:ellipsis}
.code li::before{content:attr(data-n);display:inline-block;width:4ch;padding-right:12px;text-align:right;color:var(--fg-3);opacity:.75}
.code li.hl{color:var(--fg);background:linear-gradient(90deg,rgba(155,225,93,.12),transparent 90%);box-shadow:inset 2px 0 0 var(--hi)}
.code li.hl::before{color:var(--fg-2);opacity:1}
.code li.cur::after{content:"\258C";color:var(--hi);margin-left:1px;animation:pkblink 1s steps(1) infinite}
.code li.cur.tp::after{animation:none}
@keyframes pkblink{50%{opacity:0}}
.code .xk{color:#d7a6ff}
.code .xf{color:#7fd6ff}
.code .xs{color:#ffcf8a}
.code .xn{color:#8fffbf}
.code .xc{color:#67776d;font-family:var(--cjk)}
/* 04 Agent 终端（车间层） */
.term{flex:1;display:flex;flex-direction:column;min-height:0;margin:8px 10px 10px;background:rgba(4,6,5,.72);border:1px solid rgba(190,255,200,.1);border-radius:3px;overflow:hidden}
.th{flex:none;display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid rgba(190,255,200,.08);font-size:10px;color:var(--fg-2);white-space:nowrap}
.th::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--or));box-shadow:0 0 6px var(--c,var(--or))}
.th b{font-family:var(--cjk);font-weight:700;color:var(--fg);font-size:11px}
.th span{margin-left:auto;font-size:9px;letter-spacing:.1em;color:var(--fg-3)}
.th span.busy::before{content:"";display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:-1px;border:1.5px solid var(--fg-3);border-top-color:var(--c,var(--hi));border-radius:50%;animation:pkspin .9s linear infinite}
@keyframes pkspin{to{transform:rotate(360deg)}}
.tl{flex:1;padding:6px 10px 8px;font:400 10px/16px var(--cjk);color:var(--fg-2);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;min-height:0}
.tl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl div::before{content:"\203A  ";color:var(--fg-3);font-family:var(--mono)}
.tl .ok{color:#8fe3b2}
.tl .ok::before{content:"\2713  ";color:var(--ok)}
.tl .er{color:#ff9c94}
.tl .er::before{content:"\2717  ";color:var(--bad)}
.tl .dim{color:var(--fg-3);padding-left:1.4em}
.tl .dim::before{content:""}
.tl .hd2{color:var(--fg)}
.tl .hd2::before{content:"\25CF  ";color:var(--c,var(--or))}
.tl .cur::after{content:"\258C";color:var(--c,var(--hi));animation:pkblink 1s steps(1) infinite}
.tdone{flex:none;margin:0 10px 8px;padding:6px 9px;border:1px solid rgba(63,227,155,.35);background:rgba(63,227,155,.07);font:500 10.5px/1.3 var(--cjk);color:#bff5d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdone::before{content:"\2713  ";color:var(--ok);font-family:var(--mono)}
/* 05 事件流 */
.evp{flex:none;height:206px}
.log{flex:1;padding:6px 12px;font-size:9.5px;line-height:17px;overflow:hidden;color:var(--fg-3);min-height:0}
.lr{display:grid;grid-template-columns:54px 40px minmax(0,1fr);gap:8px;white-space:nowrap}
.lr .a{color:var(--c,var(--hi));letter-spacing:.04em}
.lr .x{color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;font-family:var(--cjk)}
.lr.fresh .x{color:var(--fg)}
.lr.w .x{color:var(--warn)}
.lr.r .x{color:#ff8a80}

/* 底栏：工序矩阵（园区）/ 节拍甘特（车间）+ 场景切换 */
.btm{position:absolute;left:382px;right:382px;bottom:40px;height:192px}
.tabs{display:flex;gap:4px;pointer-events:auto}
.tabs button{font:500 9.5px/1 var(--mono);letter-spacing:.08em;color:var(--fg-3);background:transparent;border:1px solid rgba(190,255,200,.14);padding:4px 7px;cursor:pointer;white-space:nowrap}
.tabs button span{font-family:var(--cjk);font-size:10.5px;margin-left:4px;color:var(--fg-2)}
.tabs button i{display:inline-block;width:6px;height:6px;background:var(--c,var(--hi));margin-right:5px;vertical-align:0}
.tabs button:hover{border-color:var(--c,var(--hi));color:var(--fg)}
.tabs button.on{color:#0b1207;background:var(--c,var(--hi));border-color:var(--c,var(--hi))}
.tabs button.on span{color:#0b1207;font-weight:700}
.tabs button.on i{background:#0b1207}
.tabs button:focus-visible{outline:1px solid var(--fg);outline-offset:1px}
.mx{flex:1;display:grid;grid-template-rows:auto repeat(6,minmax(0,1fr));gap:3px;padding:6px 10px 8px;min-height:0}
.mxh,.mxr{display:grid;grid-template-columns:112px repeat(5,minmax(0,1fr)) 96px;gap:4px;align-items:center;min-height:0}
.mxh{font-size:8.5px;letter-spacing:.14em;color:var(--fg-3);padding:0 2px 2px}
.mxh span:last-child{text-align:right}
.mxr{cursor:pointer;pointer-events:auto}
.mxr .hn{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;padding-left:6px;border-left:2px solid var(--c);height:100%}
.mxr .hn u{text-decoration:none;font-size:10px;font-weight:700;color:var(--c)}
.mxr .hn b{font-family:var(--cjk);font-size:11.5px;font-weight:700;color:var(--fg)}
.mxr:hover .hn b{color:var(--c)}
.mc{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 7px;background:rgba(255,255,255,.03);border:1px solid rgba(190,255,200,.06);min-width:0;overflow:hidden}
.mc span{display:flex;align-items:center;gap:5px;font:500 10px/1 var(--cjk);color:var(--fg-2);white-space:nowrap;overflow:hidden}
.mc span::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--fg-3)}
.mc span em{font-style:normal;margin-left:auto;font:500 9px/1 var(--mono);color:var(--fg-3);font-variant-numeric:tabular-nums}
.mc .bar{height:3px}
.mc.run{border-color:var(--c)}
.mc.run span{color:var(--fg)}
.mc.run span::before{background:var(--c);box-shadow:0 0 6px var(--c)}
.mc.hold span::before,.mc.block span::before{background:var(--warn)}
.mc.hold .bar i{background:var(--warn)}
.mc.rej span::before{background:var(--bad)}
.mc.rej .bar i{background:var(--bad)}
.mc.done span::before{background:var(--ok)}
.mc.none{visibility:hidden}
.mxr .ho{text-align:right;font-size:9px;color:var(--fg-3);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.35}
.mxr .ho b{font-size:12px;color:var(--fg);font-weight:600}
.gc{flex:1;position:relative;margin:6px 10px 8px;min-height:0}
.gc canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.park .gc,.park .cons,.hall .mx,.hall .cons,.hub .mx,.hub .gc{display:none}
.hub .btm{height:318px}
/* 调度控制台（中枢场景） */
.cons{flex:1;display:flex;flex-direction:column;gap:5px;padding:7px 10px 9px;min-height:0;pointer-events:auto;animation:pgin .5s ease-out}
.cg{display:flex;align-items:center;gap:10px;padding:5px 8px 7px;border-bottom:1px dashed var(--line);white-space:nowrap}
.cg .cs{margin-left:auto;font-size:9.5px;color:var(--fg-3);letter-spacing:.06em;font-family:var(--cjk)}
.cg .cs b{color:var(--fg);font-family:var(--mono);font-weight:600}
.cbx{font:600 10.5px/1 var(--cjk);letter-spacing:.04em;color:var(--fg-2);background:rgba(255,255,255,.04);border:1px solid rgba(190,255,200,.22);padding:6px 10px;cursor:pointer;white-space:nowrap}
.cbx:hover{border-color:var(--hi);color:var(--fg)}
.cbx.red:hover{border-color:var(--bad);color:#ffb4ae}
.cbx:focus-visible,.sw:focus-visible,.seg button:focus-visible,.mt:focus-visible{outline:1px solid var(--fg);outline-offset:1px}
.sw{position:relative;display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 9px 0 4px;border:1px solid rgba(190,255,200,.22);background:rgba(255,255,255,.04);font:600 10px/1 var(--cjk);color:var(--fg-3);cursor:pointer;white-space:nowrap}
.sw i{position:relative;width:30px;height:14px;border-radius:7px;background:rgba(255,255,255,.12);transition:background .25s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;border-radius:50%;background:#9aa69e;transition:transform .25s,background .25s}
.sw.on{color:var(--fg);border-color:var(--c,var(--ok))}
.sw.on i{background:var(--c,var(--ok))}
.sw.on i::after{transform:translateX(16px);background:#fff}
.sl{display:flex;align-items:center;gap:8px;font:500 10px/1 var(--cjk);color:var(--fg-3);white-space:nowrap}

   26. 渲染循环
   ===================================================================== */
var last = 0, uiAcc = 0, fpsAcc = 0, fpsN = 0, todAcc = 1, FC = 0;
var GOV = { t: 0, acc: 0, n: 0, bad: 0, lvl: 0, run: 0 };
function govern(raw) {
  if (!Q.auto) return;
  GOV.run += raw; if (GOV.run < 5) return;
  GOV.acc += raw; GOV.n++; GOV.t += raw;
  if (GOV.t < 2.5) return;
  var avg = GOV.acc / GOV.n; GOV.t = 0; GOV.acc = 0; GOV.n = 0;
  GOV.bad = avg > 1 / 34 ? GOV.bad + 1 : 0;
  if (GOV.bad >= 2 && GOV.lvl < 3) { GOV.bad = 0; GOV.lvl++; if (GOV.lvl === 1) Q.ms = false; else if (GOV.lvl === 2) { Q.dpr = Math.max(0.6, L.dpr * 0.75); layout(); } else Q.sh = false; }
}
function frame(ts) {
  requestAnimationFrame(frame);

  var raw = last ? (ts - last) / 1000 : 0.016, dt = Math.min(0.05, raw);

  placeHud();
  uiAcc += dt; fpsAcc += dt; fpsN++; todAcc += dt;
  if (uiAcc > 0.2) { uiAcc = 0; updatePanels(); }
  if (fpsAcc > 0.5) { setTxt($("sFps"), String(Math.round(fpsN / fpsAcc))); fpsAcc = 0; fpsN = 0; }
  if (todAcc > 1) { todAcc = 0; todSync(); }
}

  const ORDER = ['park', 'hq'], KEY = 'agent-series-theme';
  function loadScripts(list){
    return list.reduce((p, src) => p.then(() => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = res; document.head.appendChild(s); })), Promise.resolve());
  }
  const mounted = {}, picker = document.getElementById('picker');
  let cur = null, lastFocus = null;
  function show(id){
    if (!THEMES[id]) id = 'hq';
    ORDER.forEach(k => { document.getElementById(THEMES[k].host).hidden = k !== id; });
    const T = THEMES[id], host = document.getElementById(T.host);
    if (!mounted[id]) {
      mounted[id] = true;
      const SR = host.attachShadow({mode: 'open'});
      SR.appendChild(document.getElementById(T.tpl).content.cloneNode(true));
      SR.querySelectorAll('[data-series-pick]').forEach(b => b.addEventListener('click', openPicker));
      const go = () => { try { T.mount(host, SR); } catch (e) { console.error(e); } };
      if (T.deps && !window.THREE) loadScripts(T.deps).then(go); else go();
    }
    cur = id;
    document.documentElement.dataset.series = id;
    document.querySelectorAll('.tcard[data-theme-id]').forEach(b => b.setAttribute('aria-current', String(b.dataset.themeId === id)));
    try { localStorage.setItem(KEY, id); } catch (e) { /* 存不了就算了 */ }
    try { if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id); } catch (e) { /* 预览环境可能不让改地址 */ }
  }
  function openPicker(){ lastFocus = document.activeElement; picker.hidden = false; const c = picker.querySelector('.tcard[aria-current="true"]') || picker.querySelector('.tcard'); c && c.focus(); }
  function closePicker(){ picker.hidden = true; try { lastFocus && lastFocus.focus && lastFocus.focus(); } catch (e) {} }
  picker.addEventListener('click', e => { if (e.target === picker) closePicker(); });
  document.getElementById('pkX').addEventListener('click', closePicker);
  picker.querySelectorAll('.tcard[data-theme-id]').forEach(b => b.addEventListener('click', () => { show(b.dataset.themeId); closePicker(); }));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !picker.hidden) { closePicker(); return; }
    const t0 = e.composedPath ? e.composedPath()[0] : e.target, tag = (t0 && t0.tagName) || '';
    if ((e.key === 't' || e.key === 'T') && !e.metaKey && !e.ctrlKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(tag)) {
      show(ORDER[(ORDER.indexOf(cur) + 1) % ORDER.length]);
    }
  });
  window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (THEMES[h] && h !== cur) show(h); });
  let start = location.hash.slice(1);
  if (!THEMES[start]) { try { start = localStorage.getItem(KEY) || ''; } catch (e) { start = ''; } }
  show(THEMES[start] ? start : 'hq');
})();
</script>
