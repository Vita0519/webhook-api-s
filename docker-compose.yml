services:
  webhook-api:
    image: ghcr.nju.edu.cn/sxkiss/webhook-api:latest
    pull_policy: always
    container_name: webhook-api
    ports:
      - "8100:8100"
    volumes:
      - ./storage:/app/storage
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
