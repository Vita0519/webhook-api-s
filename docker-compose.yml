version: "3.8"

services:
  webhook-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webhook-api
    ports:
      - "8100:8100"
    volumes:
      - ./storage:/app/storage
    environment:
      - WEBHOOK_API_KEY=${WEBHOOK_API_KEY:-webhook-default-key-change-me}
      - WEBHOOK_POLL_INTERVAL=${WEBHOOK_POLL_INTERVAL:-2}
      - WEBHOOK_MSG_RETENTION=${WEBHOOK_MSG_RETENTION:-7}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8100/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
